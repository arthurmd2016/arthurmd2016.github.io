<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arthur Desenho</title>
  <style>
    :root {
      --bg: #f6f0e7;
      --panel: #fffaf4;
      --panel-2: #f0e0bf;
      --text: #1c1c1c;
      --muted: #5d564d;
      --accent: #d9ab4d;
      --canvas-bg: #ffffff;
      --canvas-border: #d4a64c;
      --shadow: rgba(20, 20, 20, 0.18);
    }

    body[data-theme="dark"] {
      --bg: #0d1117;
      --panel: #1b2430;
      --panel-2: #2b3746;
      --text: #eef4ff;
      --muted: #c7d0dc;
      --accent: #f0c96b;
      --canvas-bg: #101820;
      --canvas-border: #f0c96b;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    body[data-theme="both"] {
      --bg: linear-gradient(135deg, #faf2e5 0%, #f2e5c7 35%, #1b2330 35%, #090f18 100%);
      --panel: rgba(255,255,255,0.82);
      --panel-2: rgba(255,255,255,0.5);
      --text: #1a1a1a;
      --muted: #4c493f;
      --accent: #d3a23e;
      --canvas-bg: #ffffff;
      --canvas-border: #d3a23e;
      --shadow: rgba(15,15,15,0.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 18px 36px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 1.5px;
      text-shadow: 0 0 18px rgba(255, 205, 92, 0.35);
    }

    .theme-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .theme-btn {
      border: 2px solid var(--panel-2);
      background: var(--panel);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px var(--shadow);
    }

    .theme-btn.active {
      border-color: var(--accent);
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
    }

    .panel {
      background: var(--panel);
      border: 2px solid var(--panel-2);
      border-radius: 18px;
      box-shadow: 0 10px 26px var(--shadow);
      padding: 16px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .palette-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      max-width: 740px;
    }

    .palette {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      align-items: center;
      max-width: 760px;
      overflow-x: auto;
      padding: 6px 4px;
      scrollbar-width: thin;
    }

    .palette.hidden {
      display: none;
    }

    .color-btn {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.8);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.12s ease;
      flex-shrink: 0;
    }

    .color-btn:hover { transform: scale(1.05); }

    .color-btn.active {
      outline: 3px solid var(--text);
      outline-offset: 2px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .tool-btn,
    .action-btn {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      background: linear-gradient(180deg, #f5d98c, #d8a13d);
      color: #1d1408;
    }

    .tool-btn.active {
      background: linear-gradient(180deg, #9de0ff, #3aa0ff);
      color: #061b2c;
    }

    .brush-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-2);
      border-radius: 12px;
      padding: 8px 12px;
      font-weight: 700;
    }

    .zoom-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      background: var(--panel-2);
      border-radius: 12px;
      padding: 8px 10px;
    }

    .action-btn.small {
      padding: 8px 12px;
      min-width: 42px;
    }

    input[type="range"] {
      width: 120px;
      accent-color: var(--accent);
    }

    .canvas-box {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.04);
      border-radius: 16px;
      padding: 14px;
      overflow: hidden;
      min-height: 520px;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 1000px;
      height: auto;
      background: var(--canvas-bg);
      border: 4px solid var(--canvas-border);
      border-radius: 16px;
      box-shadow: 0 14px 28px rgba(0,0,0,0.15);
      cursor: crosshair;
      touch-action: none;
      transform-origin: center center;
      transition: transform 0.08s ease;
    }

    #bgCanvas {
      position: absolute;
      inset: 14px;
      width: calc(100% - 28px);
      height: calc(100% - 28px);
      max-width: none;
      background: transparent;
      border: none;
      box-shadow: none;
      pointer-events: none;
      z-index: 0;
    }

    #canvas {
      position: relative;
      z-index: 1;
    }

    .legend {
      margin-top: 12px;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
    }

    .fps-value {
      min-width: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-left: 8px;
    }

    .frame-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .frame-strip {
      display: grid;
      grid-template-columns: repeat(4, 110px);
      justify-content: flex-start;
      gap: 8px;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid rgba(125, 141, 163, 0.38);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.25);
      max-width: 100%;
      overflow-x: auto;
    }

    .frame-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 6px 4px;
      background: rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .frame-item.active {
      border-color: #3d8cf0;
      background: rgba(61, 140, 240, 0.12);
    }

    .frame-item canvas {
      width: 100%;
      height: 72px;
      border-radius: 8px;
      background: var(--canvas-bg, #fefefe);
      border: 1px solid rgba(17, 17, 17, 0.15);
      image-rendering: auto;
    }

    .frame-item span {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
  </style>
</head>
<body data-theme="light">
  <div class="app">
    <div class="topbar">
      <h1>🎨 ARTHUR DESENHO</h1>
      <div class="theme-switch" aria-label="Tema do aplicativo">
        <button class="theme-btn active" data-theme="light">Claro</button>
        <button class="theme-btn" data-theme="dark">Escuro</button>
        <button class="theme-btn" data-theme="both">Ambos</button>
      </div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <div class="palette-wrap">
          <button class="action-btn" id="colorToggleBtn" type="button">🎨 Cores</button>
          <div class="palette" id="palette" aria-label="Paleta de cores"></div>
        </div>

        <div class="controls">
          <button class="tool-btn active" data-tool="brush">✏️ Pincel</button>
          <button class="tool-btn" data-tool="fill">🪣 Preencher</button>
          <button class="tool-btn" data-tool="circle">◯ Círculo</button>
          <button class="tool-btn" data-tool="square">▢ Quadrado</button>
          <button class="tool-btn" data-tool="rectangle">▭ Retângulo</button>
          <button class="tool-btn" data-tool="roundedRect">⬭ Ret. redondo</button>
          <button class="tool-btn" data-tool="triangle">△ Triângulo</button>
          <button class="tool-btn" data-tool="eraser">🧽 Borracha</button>
          <button class="tool-btn" data-tool="shadow">☀️ Sombra</button>

          <label class="brush-wrap" for="brushSize">
            <span>Grossura</span>
            <input id="brushSize" type="range" min="2" max="30" value="7" />
          </label>

          <div class="zoom-panel" aria-label="Zoom e rotação">
            <button class="action-btn small" id="zoomOutBtn" type="button">−</button>
            <button class="action-btn small" id="zoomInBtn" type="button">+</button>
            <button class="action-btn small" id="resetZoomBtn" type="button">100%</button>
            <label class="brush-wrap" for="rotateSlider">
              <span>Giro</span>
              <input id="rotateSlider" type="range" min="0" max="360" value="0" />
            </label>
          </div>

          <div class="zoom-panel" aria-label="Animação e quadros">
            <label class="brush-wrap" for="fpsSlider">
              <span>FPS</span>
              <input id="fpsSlider" type="range" min="1" max="60" value="24" />
              <strong id="fpsValue" class="fps-value">24</strong>
            </label>
            <label class="brush-wrap" for="bgPointsSlider">
              <span>Pontos</span>
              <input id="bgPointsSlider" type="range" min="4" max="80" value="18" />
            </label>
            <button class="action-btn" id="toggleAnimationBtn" type="button">Animação: Ligada</button>
            <button class="action-btn" id="saveFrameBtn" type="button">Salvar quadro</button>
            <button class="action-btn" id="newFrameBtn" type="button">Novo quadro</button>
            <button class="action-btn" id="copyFrameBtn" type="button">Copiar quadro</button>
            <button class="action-btn" id="saveProjectBtn" type="button">Salvar projeto</button>
            <button class="action-btn" id="loadProjectBtn" type="button">Abrir projeto</button>
            <input id="projectFileInput" type="file" accept="application/json,.json" hidden />
            <button class="action-btn" id="playFramesBtn" type="button">Play</button>
          </div>

          <button class="action-btn" id="clearBtn">Limpar</button>
          <button class="action-btn" id="formatBtn" type="button">Formatar</button>
          <button class="action-btn" id="saveDrawingBtn" type="button">Salvar desenho PNG</button>
          <button class="action-btn" id="saveBtn" type="button">Salvar GIF 92×48</button>
          <button class="action-btn" id="exitBtn" type="button">Sair</button>
        </div>
      </div>

      <div class="canvas-box">
        <canvas id="bgCanvas" width="1000" height="520" aria-hidden="true"></canvas>
        <canvas id="canvas" width="1000" height="520"></canvas>
      </div>

      <div class="frame-controls" aria-label="Navegação de quadros">
        <button class="action-btn small" id="prevFrameBtn" type="button">◀ Quadro</button>
        <span id="frameStatus">Quadro 1/1</span>
        <button class="action-btn small" id="nextFrameBtn" type="button">Quadro ▶</button>
        <button class="action-btn small" id="deleteFrameBtn" type="button">Apagar quadro</button>
      </div>

      <div id="frameStrip" class="frame-strip" aria-label="Lista de quadros em ordem"></div>

      <div class="legend">Desenhe livremente, pinte áreas conectadas, use círculos e ative a sombra do sol para deixar o desenho com mais detalhe.</div>
    </div>
  </div>

  <script src="./gif.js"></script>
  <script src="./arthur-desenho.js"></script>
  <script>
    document.getElementById('exitBtn')?.addEventListener('click', () => {
      window.location.href = '../../Arthur-jogos.html';
    });
  </script>
</body>
</html>
